services:
  - type: web
    name: damak-farm-api
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/mpesa/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://clintonweisei09.github.io
      - key: MPESA_ENVIRONMENT
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_BUSINESS_NAME
        value: Damak Farm
